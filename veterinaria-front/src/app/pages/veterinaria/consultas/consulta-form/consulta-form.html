<div class="page-container">
  <div class="page-header">
    <h2>Nueva Consulta</h2>
    <a routerLink="/veterinaria/consultas" class="btn-back">← Volver</a>
  </div>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="mascotaId">Mascota *</label>
        <select id="mascotaId" formControlName="mascotaId">
          <option [value]="null">Seleccionar mascota</option>
          @for (mascota of mascotas; track mascota.id) {
            <option [value]="mascota.id">{{ mascota.nombre }} ({{ mascota.tipo }})</option>
          }
        </select>
        @if (mascotaId?.invalid && mascotaId?.touched) {
          <span class="field-error">Seleccioná una mascota</span>
        }
      </div>

      <div class="form-group">
        <label for="veterinarioId">Veterinario</label>
        <select id="veterinarioId" formControlName="veterinarioId">
          <option [value]="null">Sin asignar</option>
          @for (vet of veterinarios; track vet.id) {
            <option [value]="vet.id">{{ vet.username }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="sintomas">Síntomas *</label>
        <textarea
          id="sintomas"
          formControlName="sintomas"
          rows="4"
          placeholder="Describí los síntomas de la mascota...">
        </textarea>
        @if (sintomas?.invalid && sintomas?.touched) {
          <span class="field-error">Los síntomas son requeridos (mínimo 5 caracteres)</span>
        }
      </div>

      <div class="form-actions">
        <a routerLink="/veterinaria/consultas" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
          {{ loading ? 'Agendando...' : 'Agendar consulta' }}
        </button>
      </div>

    </form>
  </div>
</div>
