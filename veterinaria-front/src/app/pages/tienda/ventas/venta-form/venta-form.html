<div class="tienda-form-container">
  <h2>Registrar Nueva Venta</h2>

  @if (loading) {
    <div class="alert alert-info">Cargando productos...</div>
  }

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  @if (successMessage) {
    <div class="alert alert-success"><i class="bi bi-check-circle"></i> {{ successMessage }}</div>
  }

  <form [formGroup]="ventaForm" (ngSubmit)="guardar()" class="custom-form">
    
    <div formArrayName="detalles" class="detalles-container">
      <h3>Detalles de la Venta</h3>
      
      @for (detalle of detalles.controls; track $index) {
        <div [formGroupName]="$index" class="detalle-row">
          
          <div class="form-group flex-2">
            <label>Producto</label>
            <select formControlName="productoId" class="form-control">
              <option [ngValue]="null" disabled>Seleccione un producto</option>
              @for (prod of productos; track prod.id) {
                <option [ngValue]="prod.id" [disabled]="prod.stock === 0">
                  {{ prod.nombre }} - {{ prod.precio | currency:'PEN' }} (Stock: {{ prod.stock }})
                </option>
              }
            </select>
          </div>

          <div class="form-group flex-1">
            <label>Cantidad</label>
            <input type="number" formControlName="cantidad" class="form-control" min="1">
          </div>

          <div class="form-group flex-1">
            <label>Subtotal</label>
            <input type="text" [value]="detalle.get('subtotal')?.value | currency:'PEN'" class="form-control" disabled>
          </div>

          <div class="form-group actions">
            <button type="button" (click)="eliminarDetalle($index)" class="btn btn-sm btn-outline-danger mt-4" [disabled]="detalles.length === 1">X</button>
          </div>
        </div>
      }
    </div>

    <div class="add-action">
      <button type="button" (click)="agregarDetalle()" class="btn btn-outline-primary">+ Agregar Producto</button>
    </div>

    <div class="total-section">
      <h3>Total Venta: {{ totalVenta | currency:'PEN' }}</h3>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="ventaForm.invalid || detalles.length === 0">
        Registrar Venta
      </button>
      <a routerLink="/tienda/ventas" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>
