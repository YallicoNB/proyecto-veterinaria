# Perfil Docker — sobrescribe datasource para conectar al contenedor MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/veterinaria_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
