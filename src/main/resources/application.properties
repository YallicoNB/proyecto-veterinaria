spring.application.name=proyecto-veterinaria

# JWT Secret
jwt.secret=miClaveSuperSecretaVeterinaria2026JWTSegura123

# 1. Configuración de la base de datos MySQL
# IMPORTANTE: Cambia "root" y "tu_contraseña" por las credenciales reales de tu MySQL Workbench
# Habilita la obtención de clave pública
# Crea la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de JPA / Hibernate
# 'update' creará las tablas automáticamente si no existen y las actualizará si hay cambios
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en consola (útil para ver qué hace JPA por detrás)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configura el ID del cliente Google
spring.security.oauth2.client.registration.google.client-id=google-client-id-template-2026
# Configura clave secreta del cliente Google
spring.security.oauth2.client.registration.google.client-secret=google-client-secret-template-2026
# Define alcances solicitados al usuario Google
spring.security.oauth2.client.registration.google.scope=profile,email
